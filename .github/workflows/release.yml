name: "Release Pipeline"

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Build, Sign & Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Tauri Application Bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Parse Signatures & Compile Update Manifest
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          echo "Compiling updater manifest for tag: $TAG_NAME"
          
          # 1. Determine release channel based on the tag name
          CHANNEL="Production"
          MANIFEST_FILE="latest.json"
          
          if [[ "$TAG_NAME" == *"preview"* ]]; then
            CHANNEL="Preview"
            MANIFEST_FILE="preview-latest.json"
          elif [[ "$TAG_NAME" == *"internal"* ]]; then
            CHANNEL="Internal"
            MANIFEST_FILE="internal-latest.json"
          fi
          
          echo "Channel resolved: $CHANNEL -> Manifest file: $MANIFEST_FILE"
          
          # 2. Strict NSIS executable & signature verification
          NSIS_DIR="src-tauri/target/release/bundle/nsis"
          EXE_COUNT=$(find "$NSIS_DIR" -name "*.exe" 2>/dev/null | wc -l)
          SIG_COUNT=$(find "$NSIS_DIR" -name "*.exe.sig" 2>/dev/null | wc -l)
          
          echo "Found $EXE_COUNT NSIS installer executable(s) and $SIG_COUNT NSIS signature file(s)."
          
          if [ "$EXE_COUNT" -ne 1 ]; then
            echo "Error: Expected exactly 1 NSIS installer (.exe) in $NSIS_DIR, found $EXE_COUNT."
            exit 1
          fi
          
          if [ "$SIG_COUNT" -ne 1 ]; then
            echo "Error: Expected exactly 1 NSIS signature file (.exe.sig) in $NSIS_DIR, found $SIG_COUNT."
            exit 1
          fi
          
          SIG_FILE=$(find "$NSIS_DIR" -name "*.exe.sig" | head -n 1)
          SIGNATURE=$(cat "$SIG_FILE")
          echo "Signature successfully extracted from $SIG_FILE"
          
          # 3. Resolve the signed payload file
          PAYLOAD_FILE="${SIG_FILE%.sig}"
          if [ ! -f "$PAYLOAD_FILE" ]; then
            echo "Error: Signed payload file ($PAYLOAD_FILE) does not exist."
            exit 1
          fi
          PAYLOAD_NAME=$(basename "$PAYLOAD_FILE")
          ENCODED_NAME=$(echo "$PAYLOAD_NAME" | sed 's/ /%20/g')
          echo "Signed payload resolved: $PAYLOAD_NAME -> Encoded: $ENCODED_NAME"
          
          # 4. Create the manifest payload
          DOWNLOAD_URL="https://github.com/janayuv/sales-monitoring-system/releases/download/$TAG_NAME/$ENCODED_NAME"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          # Strip 'v' prefix if present for version comparison compatibility
          VERSION="${TAG_NAME#v}"
          
          cat <<EOF > "$MANIFEST_FILE"
          {
            "version": "$VERSION",
            "pub_date": "$PUB_DATE",
            "manifestVersion": 1,
            "platforms": {
              "windows-x86_64": {
                "signature": "$SIGNATURE",
                "url": "$DOWNLOAD_URL"
              }
            }
          }
          EOF
          
          echo "Created update manifest payload:"
          cat "$MANIFEST_FILE"

          # 5. Schema Validation Gate
          echo "Validating manifest schema structure..."
          node -e '
            const fs = require("fs");
            const manifestPath = process.env.MANIFEST_FILE || "latest.json";
            const data = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
            if (!data.version || !data.pub_date || !data.platforms) {
              console.error("Schema Validation Error: Missing required top-level keys.");
              process.exit(1);
            }
            const platformKeys = Object.keys(data.platforms);
            if (platformKeys.length === 0) {
              console.error("Schema Validation Error: No platform entries defined.");
              process.exit(1);
            }
            for (const key of platformKeys) {
              const plat = data.platforms[key];
              if (!plat.signature || !plat.url) {
                console.error(`Schema Validation Error: Platform ${key} missing signature or url.`);
                process.exit(1);
              }
            }
            console.log("Manifest schema validation passed successfully!");
          '

      - name: Generate Github Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, 'preview') || contains(github.ref_name, 'internal') }}
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/**/*.zip
            src-tauri/target/release/bundle/**/*.sig
            *.json
          body: |
            ## Release Notes
            Sales Monitoring System release version ${{ github.ref_name }}.
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Verify Live Release Asset Reachability
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          echo "Verifying live asset reachability for tag $TAG_NAME..."
          # Allow up to 10 seconds for GitHub Release asset propagation
          sleep 10
          
          MANIFEST_NAME="latest.json"
          if [[ "$TAG_NAME" == *"preview"* ]]; then
            MANIFEST_NAME="preview-latest.json"
          elif [[ "$TAG_NAME" == *"internal"* ]]; then
            MANIFEST_NAME="internal-latest.json"
          fi
          
          MANIFEST_URL="https://github.com/janayuv/sales-monitoring-system/releases/download/$TAG_NAME/$MANIFEST_NAME"
          echo "Checking reachability of $MANIFEST_URL (following redirects)..."
          
          STATUS=$(curl -sL -w "%{http_code}" -o /dev/null "$MANIFEST_URL" || echo "000")
          echo "HTTP Response Code for $MANIFEST_NAME: $STATUS"
          
          if [ "$STATUS" -ne 200 ]; then
            echo "Warning: Asset $MANIFEST_NAME returned HTTP status $STATUS. (Verify repository public visibility settings if status is 404)."
          else
            echo "Asset $MANIFEST_NAME is publicly accessible and verified!"
          fi
